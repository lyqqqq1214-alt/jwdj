# ===== AITAES 数智化教学分析评价系统 =====
spring:
  application:
    name: AITAES
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.aitaes.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 日志 =====
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [AITAES] %-5level %logger{36} - %msg%n"

# ===== AITAES 业务配置 =====
aitaes:
  import:
    batch-size: 500
    max-errors: 100
  ai:
    ollama:
      base-url: ${AI_BASE_URL:https://maas.nscc-cs.cn/external/api/v1}
      api-key: ${AI_API_KEY:sk-CDenXwHI21wMKVliUuqXNGVxfw53uNzypwyUmNZwbIm2v3N7}
      model: ${AI_MODEL:deepseek-v4-pro}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:10s}
      read-timeout: ${OLLAMA_READ_TIMEOUT:300s}
      max-attempts: ${OLLAMA_MAX_ATTEMPTS:3}
      retry-delay: ${OLLAMA_RETRY_DELAY:1s}
      temperature: ${OLLAMA_TEMPERATURE:0.2}
