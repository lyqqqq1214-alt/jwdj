# ===== AITAES 数智化教学分析评价系统 =====
spring:
  application:
    name: AITAES
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.aitaes.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 日志 =====
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [AITAES] %-5level %logger{36} - %msg%n"

# ===== AITAES 业务配置 =====
aitaes:
  import:
    batch-size: 500
    max-errors: 100
  ai:
    ollama:
      base-url: ${AI_BASE_URL:https://llm-npyrxu39mzdlb84q.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:sk-7d7fb4f80c724cd99e4b4478ed84e365}
      model: ${AI_MODEL:qwen3.7-max-2026-06-08}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:5s}
      read-timeout: ${OLLAMA_READ_TIMEOUT:30s}
      max-attempts: ${OLLAMA_MAX_ATTEMPTS:1}
      retry-delay: ${OLLAMA_RETRY_DELAY:1s}
      temperature: ${OLLAMA_TEMPERATURE:0.2}
