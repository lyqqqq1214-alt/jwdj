# ===== H2 内嵌数据库开发配置（无需安装MySQL）=====
spring:
  datasource:
    url: jdbc:h2:file:./data/aitaes;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-schema.sql