# ===== MySQL 数据库生产/开发配置 =====
# 需要提前创建数据库 `aitaes_db` 及专用账号（见 deploy/setup-db.ps1）。
# 账号密码通过环境变量注入：SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aitaes_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:aitaes}
    password: ${SPRING_DATASOURCE_PASSWORD:ChangeMe_Production}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      schema-locations: classpath:db/init.sql
  session:
    store-type: none
  redis:
    timeout: 2s
    connect-timeout: 2s
