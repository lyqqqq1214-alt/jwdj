# ============================================================
#  AITAES 站点配置（放到 Nginx conf.d/ 下，或 include 进 nginx.conf 的 http{} 内）
#  公网端口 3000（云安全组已开放 3000–3100）
# ============================================================
server {
    listen 3000;
    server_name _;

    # 前端静态文件（npm run build 的产物，由 CI/CD 复制到此目录）
    root d:/lyq/frontend/dist;
    index index.html;

    # 与后端 multipart 限制一致
    client_max_body_size 10m;

    # 单页应用（React Router）路由回退：找不到文件时回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 Spring Boot 后端（保留 /api 前缀，后端 Controller 就映射在 /api 下）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;    # AI 分析接口耗时较长，拉长超时
        proxy_send_timeout 300s;
    }
}
