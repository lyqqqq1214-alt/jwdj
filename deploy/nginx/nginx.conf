# AITAES complete Nginx config (simple deploy)
# setup-server.ps1 copies this file over d:\lyq\nginx\conf\nginx.conf
# Listens on public port 3000, serves frontend + proxies /api to backend 8080
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen 3000;
        server_name _;

        # frontend static files (npm run build output)
        root d:/lyq/frontend/dist;
        index index.html;

        client_max_body_size 10m;

        # SPA (React Router) fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # reverse proxy to Spring Boot backend (keep /api prefix)
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
